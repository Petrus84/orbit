name: Compliance — contrato KCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identificar-contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate KCR
        shell: bash
        run: |
          set -euo pipefail

          reg=contracts/kpi/registry.json
          dec=contracts/kpi/decisions.md
          [[ -f "$reg" ]] || { echo "MISSING $reg"; exit 1; }
          [[ -f "$dec" ]] || { echo "MISSING $dec"; exit 1; }

          echo "::group::HEAD registry"
          sha256sum "$reg"
          awk 'NR<=15 { print NR": "$0 }' "$reg"
          echo "::endgroup::"

          echo "::group::HEAD decisions"
          sha256sum "$dec"
          awk 'NR<=40 { print NR": "$0 }' "$dec"
          echo "::endgroup::"

          python3 - "$reg" "$dec" << 'PY'
          import json, pathlib, sys
          reg_path, dec_path = sys.argv[1:]
          raw = json.loads(pathlib.Path(reg_path).read_text())
          kpis = raw["kpis"] if isinstance(raw, dict) else raw
          by = {k["kpi_id"]: k for k in kpis}
          if len(by) != len(kpis):
              sys.exit("kpi_id duplicado")
          if len(by) < 22:
              sys.exit(f"n_fichas={len(by)} < 22")

          def screens(kid):
              return by[kid].get("screens") or []

          def banned(path):
              p = path.lower()
              return "overview" in p or "qualityscores" in p or "sectorpositioning" in p

          if by["engagement_public"]["output"]["unit"] != "count":
              sys.exit("C1: engagement_public.unit != count")
          if screens("engagement_public"):
              sys.exit("C2: engagement_public.screens deveria ser []")
          if any(banned(s) for s in screens("play_to_view_ratio")):
              sys.exit("C2: play_to_view_ratio não pode ter tela de Overview")
          if screens("utility_caption") or screens("utility_score_pct"):
              sys.exit("C4/C5: utilidade não pode ter screens")
          if by["utility_caption"]["status"] != "proposta":
              sys.exit("C4: utility_caption deveria ser proposta")
          if by["utility_score_pct"]["status"] != "vigente":
              sys.exit("C4: utility_score_pct deveria ser vigente")
          if by["engagement_public"]["status"] != "vigente":
              sys.exit("C2: engagement_public deveria permanecer vigente")
          if by["play_to_view_ratio"]["status"] != "vigente":
              sys.exit("C2: play_to_view_ratio deveria permanecer vigente")
          print(f"registry_ok n_fichas={len(by)}")

          text = pathlib.Path(dec_path).read_text()
          need = {
              "KCR-C1": "fechado",
              "KCR-C2": "fechado",
              "KCR-C3": "fechado",
              "KCR-C4": "fechado",
              "KCR-C5": "fechado",
              "KCR-C6": "adiado",
              "KCR-C7": "adiado",
          }
          for mark, kind in need.items():
              if mark not in text or kind not in text:
                  sys.exit(f"veredito ausente ou sem estado: {mark} ({kind})")
          if "Não recoloca o tile" not in text and "Não recoloca" not in text:
              sys.exit("C5: falta a correção — RWP-1 não recoloca o tile")
          print("decisions_ok")
          PY
